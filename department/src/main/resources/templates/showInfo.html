<!DOCTYPE html>
<html lang="eng">
<head>
		<meta charset="UTF-8">
		<meta name="viewport">
		<title>view department</title>
		<link rel="stylesheet" href="css.style.css">

</head>
<body> 
		<div class="heading">
		<h2>view department information</h2>
		</div>
		
		<div class="tablecontainer">
		<form>
		<table border="5">
		<tr>
				<th>dept_id</th>
				<th>dept_name</th>
		 
		 </tr>
		 
		 <tr th:each="ref:${Department}">
		 <td th:text="${ref.dept_id}"></td>
		 <td th:text="${ref.dept_name}"></td>
	
		 </tr>

		
		</table>
	
		</form>
	
		</div>

		
</body>



</html>
